[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare"
version = "0.1.0"
description = "Human-Aware Task Planner – Nurse Rostering"
license = "EPL-2.0"
dependencies = [
    "cpmpy==0.9.26",
    "ortools==9.14.6206",
    "pandas==2.3.3",
    "matplotlib==3.10.6",
    "dataclasses-json==0.6.7",
    "flask==3.1.2",
    "apiflask==3.1.0",
    "marshmallow_dataclass==8.7.1",
    "waitress==3.0.2",
    "flask-cors==6.0.2",
    # cpmpy 0.9.26 imports pkg_resources, removed in setuptools 81
    "setuptools<81"
]

[project.optional-dependencies]
test = [
    "pytest",
    "requests"
]